<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lieven Gouwy</title>
<link rel="preload" as="image" href="Texts/AboutWhite.webp">
<link rel="preload" as="image" href="Texts/ProjectsWhite.webp">
<link rel="preload" as="image" href="Texts/ConctactWhite.webp">
<link rel="preload" as="image" href="Texts/Asan.webp">
<link rel="preload" as="image" href="Texts/mail-insta-linkedrecolor.webp">
<link rel="preload" as="image" href="Texts/Port.webp">
<link rel="preload" as="image" href="Texts/Congrats.webp">
<link rel="preload" as="image" href="Texts/HowManySeconds.webp">
<link rel="preload" as="image" href="Texts/Signup.webp">
<style>
  @font-face {
    font-family: 'Handjet';
    src: url('fonts/handjet-variable.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000000;
    overflow: hidden;
  }

  /* 1920x1080 composition, scaled down to fit the window and centered
     (JS sets the transform) so left/right and top/bottom margins
     are always equal. Never upscaled beyond 1600x900. */
  .stage {
    position: absolute;
    top: calc(50% - 30px);
    left: 50%;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #000000;
  }

  /* "LIEVEN GOUWY Systems Game Design / Narrative Design / Showrunner"
     72 px font; scaleX tuned so its ink
     spans exactly the toggle buttons' bounds x=114..842 */
  .header {
    position: absolute;
    top: 80px;
    left: 113px;
    font-family: 'Handjet', sans-serif;
    font-weight: 200;
    font-size: 72px;
    line-height: 46px;
    color: rgba(96, 87, 80, 0.2);
    -webkit-text-stroke: 1px rgba(96, 87, 80, 0.8);
    white-space: nowrap;
    transform: scaleX(0.4426);
    transform-origin: 0 0;
  }
  /* White readability layer over the name text.
     Same box/font/transform as .header — play with opacity. */
  .header-white {
    color: #ffffff;
    -webkit-text-stroke: 0;
    opacity: 0.6;
    pointer-events: none;
  }
  /* ABOUT / PROJECTS / CONTACT — exported text PNGs, all stretched
     to the same width (728 px) and height (246 px).
     The White version overlaps the normal one; clicking a word hides
     its white layer (toggle, only one word active at a time).
     5 px below the name text, then 5 px between each word. */
  .word {
    position: absolute;
    left: 114px;
    width: 728px;
    height: 246px;
    cursor: pointer;
  }
  .word img {
    display: block;
    width: 728px;
    height: 246px;
  }
  .word .white {
    position: absolute;
    top: 0;
    left: 0;
  }
  .word.active .white { visibility: hidden; }
  .word.about    { top: 143px; }
  .word.projects { top: 394px; }
  .word.contact  { top: 645px; }

  /* Asan — visible with the about toggle.
     Left 5 px from toggle right (842+5=847), top aligned with
     about top (143), right aligned with WalkingLine right (1813),
     bottom 5 px above WalkingLine top (900-5=895). */
  .asan {
    position: absolute;
    top: 143px;
    left: 847px;
    width: 966px;
    height: 752px;
    display: none;
    opacity: 0.95;
  }

  /* Port — visible with the projects toggle. Same box as Asan. */
  .port {
    position: absolute;
    top: 143px;
    left: 847px;
    width: 966px;
    height: 752px;
    display: none;
  }

  /* Mail/Instagram/LinkedIn icons — visible with the contact
     toggle. Half the test size: 112.5 px tall (~462 px wide),
     vertically centered on the contact button's centerline
     (645 + 246/2 = 768), horizontally centered in the 847..1813
     zone. */
  .links {
    position: absolute;
    top: 768px;
    left: 847px;
    width: 966px;
    height: 0;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .links img {
    height: 112.5px;
    width: auto;
  }
  /* Contact icons act as 3 buttons over the single recolor image:
     left third = mail, middle third = instagram, right third =
     LinkedIn. Transparent overlays so the artwork stays untouched. */
  .links-inner {
    position: relative;
    display: inline-block;
    line-height: 0;
  }
  .link-btn {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 33.333%;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  a.link-btn { display: block; }
  .link-btn.mail { left: 0; }
  .link-btn.insta { left: 33.333%; }
  .link-btn.linked { left: 66.666%; }

  /* WalkingLine — exported PNG, stretched to cover the zone
     (x 114..1813, y 900..1014) */
  .walkingline {
    position: absolute;
    top: 900px;
    left: 114px;
    width: 1699px;
    height: 114px;
  }

  /* 00:00 dot-matrix clock (Handjet LED-shading axis).
     Back at its previous height (top 1030), 50 px kept. */
  .clock {
    position: absolute;
    top: 1030px;
    left: 892px;
    font-family: 'Handjet', monospace;
    font-variation-settings: 'ELSH' 16;
    font-weight: 200;
    font-size: 72px;
    line-height: 46px;
    letter-spacing: 2px;
    color: rgba(96, 87, 80, 0.2);
    -webkit-text-stroke: 1px rgba(96, 87, 80, 0.8);
  }

  /* Rudy's stepcounter — same font/size/settings as the quote,
     at the quote's previous height: 5 px under the WalkingLine
     bottom (1019), right edge aligned with the line's right bound
     (1813). Width compressed to 70%, shown only after the bet. */
  .steps {
    position: absolute;
    top: 1019px;
    left: 114px;
    width: 1699px;
    font-family: 'Microsoft Yi Baiti', sans-serif;
    font-weight: 400;
    font-size: 30px;
    line-height: 18px;
    letter-spacing: 2px;
    color: #8a7e73;
    text-align: right;
    white-space: nowrap;
    transform: scaleX(0.7);
    transform-origin: 100% 0;
    display: none;
  }

  /* Le Guin quote — static text, visible with the contact toggle.
     5 px above the WalkingLine top:
     ink ends at y=895 (box top 871, ink 875..895 with the 18 px
     line-height), same font/settings as the stepcounter.
     Right edge aligned with the line's right bound (1813); the
     scaleX is tuned (966 / layout width 1619.6) so the ink's left
     edge lands 5 px right of the contact button (842+5=847).
     Width compression only — the height stays 30 px. */
  .quote {
    position: absolute;
    top: 871px;
    left: 114px;
    width: 1699px;
    font-family: 'Microsoft Yi Baiti', sans-serif;
    font-weight: 400;
    font-size: 30px;
    line-height: 18px;
    letter-spacing: 2px;
    color: #8a7e73;
    text-align: right;
    white-space: nowrap;
    transform: scaleX(0.5964);
    transform-origin: 100% 0;
    display: none;
  }

  /* HowManySeconds — shown after 4 s while the loop is paused.
     5 px gap under the WalkingLine bottom (1014+5=1019),
     stretched to the line's left/right bounds (114..1813).
     Height compressed to 61 px so it ends at the stage bottom. */
  .howmany {
    position: absolute;
    top: 1019px;
    left: 114px;
    width: 1699px;
    height: 61px;
    display: none;
  }

  /* Congrats — shown when Rudy reaches the left bound.
     Same box as HowManySeconds: 5 px under the WalkingLine,
     width aligned with the line (114..1813). */
  .congrats {
    position: absolute;
    top: 1019px;
    left: 114px;
    width: 1699px;
    height: 61px;
    display: none;
  }

  /* Signup — shown with the email input.
     Same box as Congrats, width exactly matching the WalkingLine. */
  .signup {
    position: absolute;
    top: 1019px;
    left: 114px;
    width: 1699px;
    height: 61px;
    display: none;
  }

  .clock.hidden { visibility: hidden; }
  .sprite.paused, .sprite.page-hidden { animation-play-state: paused; }

  /* Guess input — centered on the WalkingLine, 5 px away from its
     top and bottom edges (905..1009). Numbers only, blinking caret.
     The email input reuses the same box on restart. */
  .guess, .email, .result {
    position: absolute;
    top: 905px;
    left: 843.5px;
    width: 240px;
    height: 104px;
    background: rgba(0, 0, 0, 0.35);
    border: none;
    outline: none;
    border-radius: 10px;
    color: #ccaea5;
    font-family: 'Handjet', monospace;
    font-weight: 200;
    font-size: 72px;
    line-height: 104px;
    text-align: center;
    caret-color: #d9a6a8;
  }
  .guess { display: none; }
  /* Final time shown with Congrats — same box/background idea as the
     time input, but wider (like the email field) so that e.g.
     "30.36 seconds" fits, still centered on the WalkingLine. */
  .result {
    display: none;
    width: 500px;
    left: 713.5px;
    font-size: 64px;
    white-space: nowrap;
  }
  .email {
    display: none;
    width: 500px;
    left: 713.5px;
    font-size: 48px;
  }
  .guess::placeholder {
    color: rgba(204, 174, 165, 0.9);
    font-size: 48px;
  }
  .email::placeholder {
    color: rgba(204, 174, 165, 0.6);
    font-size: 48px;
  }

  /*
    Spritesheet: 768 x 128 = 6 frames of 128 x 128.
    6 fps -> one frame every 166.67 ms, 1 s loop.
    WalkingLine layer (114, 922, 1813, 974) is the bound:
    the sprite's floor is the line's bottom edge (y=1014) + 10 px
    and it bounces between x=114 and x=1813, 60 s per
    direction. Turn points are inset so the drawn character's
    edge (content starts ~16 px inside its cell) aligns with the
    line ends. The sprite flips to face its travel direction.
    Position is driven by JS (pos/dir/rate) so a visible
    input field can act as an extra bound to bounce off.
  */
  .sprite {
    position: absolute;
    top: 897px;
    left: 0;
    width: 128px;
    height: 128px;
    background-image: url("anim/spritesheet.png");
    background-repeat: no-repeat;
    animation: play 1s steps(6) infinite;
    opacity: 0.97;
  }

  @keyframes play {
    from { background-position-x: 0; }
    to   { background-position-x: -768px; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="header">LIEVEN GOUWY Systems Game Design / Narrative Design / Showrunner</div>
    <div class="header header-white" aria-hidden="true">LIEVEN GOUWY Systems Game Design / Narrative Design / Showrunner</div>
    <div class="word about">
      <img src="Texts/About.webp" alt="About">
      <img class="white" src="Texts/AboutWhite.webp" alt="">
    </div>
    <div class="word projects">
      <img src="Texts/Projects.webp" alt="Projects">
      <img class="white" src="Texts/ProjectsWhite.webp" alt="">
    </div>
    <div class="word contact">
      <img src="Texts/Contact.webp" alt="Contact">
      <img class="white" src="Texts/ConctactWhite.webp" alt="">
    </div>
    <img class="walkingline" src="Texts/WalkingLine.webp" alt="">
    <img class="asan" src="Texts/Asan.webp" alt="Asan">
    <img class="port" src="Texts/Port.webp" alt="Port">
    <div class="links"><div class="links-inner"><img src="Texts/mail-insta-linkedrecolor.webp" alt="Mail, Instagram, LinkedIn"><a class="link-btn mail" href="mailto:gouwylieven@yahoo.com" aria-label="Email"></a><a class="link-btn insta" href="https://instagram.com/gouwylieven" target="_blank" rel="noopener" aria-label="Instagram"></a><a class="link-btn linked" href="https://www.linkedin.com/in/lieven-gouwy-43342138b/" target="_blank" rel="noopener" aria-label="LinkedIn"></a></div></div>
    <img class="congrats" src="Texts/Congrats.webp" alt="Congrats">
    <img class="signup" src="Texts/Signup.webp" alt="Signup">
    <img class="howmany" src="Texts/HowManySeconds.webp" alt="How many seconds do you think it will take Rudy to cross the screen">
    <input id="guess" class="guess" type="text" inputmode="numeric" maxlength="2" autocomplete="off" spellcheck="false" placeholder="30-90" aria-label="Your guess in seconds">
    <div id="result" class="result" aria-live="polite"></div>
    <input id="email" class="email" type="email" name="no-autocomplete-email" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Email Address..." aria-label="Email address">
    <div class="clock">00:00</div>
    <div class="steps">Rudy's stepcounter: 1</div>
    <div class="quote">The more things go on moving, interrelating, conflicting, changing, the less balance there is and the more life. - U. K. Le Guin</div>
    <div class="sprite"></div>
  </div>
<script>
  const stage = document.querySelector('.stage');
  function fitStage() {
    const s = Math.min(1600 / 1920, window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  const sprite = document.querySelector('.sprite');
  const clock = document.querySelector('.clock');
  const stepsEl = document.querySelector('.steps');
  const quoteEl = document.querySelector('.quote');
  const howmany = document.querySelector('.howmany');
  const congrats = document.querySelector('.congrats');
  const signup = document.querySelector('.signup');
  const guess = document.getElementById('guess');
  const result = document.getElementById('result');
  const email = document.getElementById('email');
  let guessedSeconds = null;

  /* 1 play loop = 1 step, counted 600 ms into the loop at 1x.
     Polled from the play animation's currentTime so it follows
     playbackRate and freezes while paused. */
  let steps = 1;
  const renderSteps = () => {
    stepsEl.textContent = `Rudy's stepcounter: ${steps}`;
  };
  renderSteps();
  let pastMid = false;
  const countMidLoop = () => {
    const pa = getPlayAnim();
    if (!pa || pa.currentTime == null) return;
    const t = Number(pa.currentTime) % 1000;
    const isMid = t >= 630;
    if (isMid && !pastMid) {
      steps++;
      renderSteps();
    }
    pastMid = isMid;
  };

  /* JS-driven patrol (replaces the old CSS `walk` keyframes) so a
     visible input field acts as an extra bound: the sprite flips
     when its drawn edge (16 px inside the 128 px cell) hits the
     field instead of crossing it. */
  const LEFT_TX = 98, RIGHT_TX = 1699;
  const BASE_SPEED = (RIGHT_TX - LEFT_TX) / 60;
  /* Base walk-cycle speed (free patrol + email phase). Changing this
     does NOT affect the pinned 30 s / 90 s guess rates below. */
  const BASE_LOOP = 1.1027;
  let pos = RIGHT_TX, dir = -1, rate = 1, running = true;
  const render = () => {
    sprite.style.transform = `translateX(${pos}px) scaleX(${dir < 0 ? 1 : -1})`;
  };
  render();
  const getPlayAnim = () => sprite.getAnimations().find(a => a.animationName === 'play');
  const visibleObstacle = () => {
    if (email.style.display === 'block') return email;
    if (guess.style.display === 'block') return guess;
    return null;
  };
  let last = performance.now();
  const moveLoop = now => {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (pageHidden) { requestAnimationFrame(moveLoop); return; }
    if (running) {
      let min = LEFT_TX, max = RIGHT_TX;
      const ob = visibleObstacle();
      if (ob) {
        const L = ob.offsetLeft, R = ob.offsetLeft + ob.offsetWidth;
        const leftStop = L - 112, rightStop = R - 16;
        if (pos > leftStop && pos < rightStop) {
          pos = (pos + 64 < (L + R) / 2) ? leftStop : rightStop;
        }
        if (pos + 64 < (L + R) / 2) max = Math.min(max, leftStop);
        else min = Math.max(min, rightStop);
      }
      pos += dir * BASE_SPEED * rate * dt;
      if (pos <= min) { pos = min; dir = 1; }
      else if (pos >= max) { pos = max; dir = -1; }
      render();
      countMidLoop();
    }
  requestAnimationFrame(moveLoop);
  };
  requestAnimationFrame(moveLoop);
  requestAnimationFrame(() => {
    const pa0 = getPlayAnim();
    if (pa0) pa0.playbackRate = BASE_LOOP;
  });

  /* Pausable timers + page-hidden handling: the sprite walk cycle
     (CSS), patrol movement/step counting (rAF) and all game timers
     freeze when the page is not active. */
  let pageHidden = false, hiddenAt = 0;
  let adjustClock = null;
  const activeTimeouts = new Set();
  const pausableTimeout = (fn, delay) => {
    const t = { fn, end: performance.now() + delay, id: 0, remaining: delay };
    t.id = setTimeout(() => { activeTimeouts.delete(t); fn(); }, delay);
    activeTimeouts.add(t);
    return t;
  };
  const setPageHidden = h => {
    if (h === pageHidden) return;
    pageHidden = h;
    if (h) {
      hiddenAt = performance.now();
      sprite.classList.add('page-hidden');
      for (const t of activeTimeouts) {
        clearTimeout(t.id);
        t.remaining = Math.max(0, t.end - hiddenAt);
      }
    } else {
      const gap = performance.now() - hiddenAt;
      last = performance.now();
      sprite.classList.remove('page-hidden');
      for (const t of activeTimeouts) {
        t.end = performance.now() + t.remaining;
        t.id = setTimeout(() => { activeTimeouts.delete(t); t.fn(); }, t.remaining);
      }
      if (adjustClock) adjustClock(gap);
    }
  };
  document.addEventListener('visibilitychange', () => setPageHidden(document.hidden));
  window.addEventListener('blur', () => setPageHidden(true));
  window.addEventListener('focus', () => { if (!document.hidden) setPageHidden(false); });

  pausableTimeout(() => {
    running = false;
    sprite.classList.add('paused');
    clock.classList.add('hidden');
    howmany.style.display = 'block';
    guess.style.display = 'block';
    guess.focus();
  }, 4000);

  guess.addEventListener('input', () => {
    let v = guess.value.replace(/[^0-9]/g, '').slice(0, 2);
    const n = parseInt(v, 10);
    if (v.length === 1 && n < 3) v = '';
    else if (v.length === 2 && (n < 30 || n > 90)) v = v.slice(0, 1);
    guess.value = v;
  });

  guess.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const n = parseInt(guess.value, 10);
    if (!Number.isInteger(n) || n < 30 || n > 90) return;
    guessedSeconds = n;
    howmany.style.display = 'none';
    guess.style.display = 'none';
    guess.blur();
    clock.classList.remove('hidden');
    sprite.classList.remove('paused');
    running = true;

    /* The guess sets the travel time: scale the patrol rate so the
       remaining distance to the left bound takes exactly n seconds
       of real time. The frame loop uses the same rate, so slower
       movement -> slower animation. */
    const playAnim = getPlayAnim();
    const remaining = pos - LEFT_TX;
    rate = remaining / (n * BASE_SPEED);
    /* Walk-cycle rate pinned to the guess: 30 s -> 1.922x,
       90 s -> 0.899557x, linearly interpolated in between. */
    if (playAnim) playAnim.playbackRate = 2.43 - (1.02 / 60) * n;

    /* Bet placed: (re)start the step count from 1 and show it.
       Anything walked before this moment does not count. */
    steps = 1;
    renderSteps();
    stepsEl.style.display = 'block';

    let start = performance.now();
    adjustClock = gap => { start += gap; };
    let arrived = false;
    const arrive = () => {
      arrived = true;
      adjustClock = null;
      /* Stop first, then snap to the left bound still facing left
         so we never freeze mid-flip. */
      running = false;
      sprite.classList.add('paused');
      pos = LEFT_TX;
      dir = -1;
      render();
      clock.classList.add('hidden');
      stepsEl.style.display = 'none';
      congrats.style.display = 'block';
      /* Show the visitor's guess + a random hundredths value
         (e.g. guess 30 -> "30.36 seconds!") centered on the
         WalkingLine with the same background as the time input. */
      const hundredths = String(Math.floor(Math.random() * 100)).padStart(2, '0');
      result.textContent = `${guessedSeconds}.${hundredths} seconds!`;
      result.style.display = 'block';
      /* Restart after 6 s at base speed; the flip happens then.
         The visible email field acts as a bound from here on. */
      pausableTimeout(() => {
        congrats.style.display = 'none';
        result.style.display = 'none';
        rate = 1;
        const pa = getPlayAnim();
        if (pa) pa.playbackRate = BASE_LOOP;
        running = true;
        sprite.classList.remove('paused');
        email.style.display = 'block';
        signup.style.display = 'block';
        email.focus();
      }, 6000);
    };
    pausableTimeout(arrive, n * 1000);
    const tick = now => {
      if (arrived) return;
      if (pageHidden) { requestAnimationFrame(tick); return; }
      const el = (now - start) / 1000;
      const ss = String(Math.floor(el) % 100).padStart(2, '0');
      const cc = String(Math.floor((el % 1) * 100)).padStart(2, '0');
      clock.textContent = ss + ':' + cc;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });

  email.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (!email.checkValidity || !email.checkValidity()) {
      if (!email.value.includes('@')) return;
    }
    signup.style.display = 'none';
    email.style.display = 'none';
    email.blur();
    stepsEl.style.display = 'block';
  });

  const words = document.querySelectorAll('.word');
  const aboutWord = document.querySelector('.word.about');
  const projectsWord = document.querySelector('.word.projects');
  const contactWord = document.querySelector('.word.contact');
  const asan = document.querySelector('.asan');
  const port = document.querySelector('.port');
  const links = document.querySelector('.links');
  words.forEach(word => {
    word.addEventListener('click', () => {
      const wasActive = word.classList.contains('active');
      words.forEach(w => w.classList.remove('active'));
      if (!wasActive) word.classList.add('active');
      asan.style.display = aboutWord.classList.contains('active') ? 'block' : 'none';
      port.style.display = projectsWord.classList.contains('active') ? 'block' : 'none';
      quoteEl.style.display = contactWord.classList.contains('active') ? 'block' : 'none';
      links.style.display = contactWord.classList.contains('active') ? 'flex' : 'none';
    });
  });
</script>
</body>
</html>
